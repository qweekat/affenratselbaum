<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f6b57">
<meta name="apple-mobile-web-app-title" content="all systems you">
<title>all systems you</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#d9dfd8; --ink:#1d2a24; --muted:#5b6b62;
  --juniper:#2f6b57; --juniper-soft:#e1eee8; --dusk:#3d4f8a; --dusk-soft:#e6e9f5;
  --warn:#9a5b00; --warn-soft:#fbf0dc; --done:#8a978f;
  --display:"Literata",Georgia,"DejaVu Serif",serif;
  --body:"Atkinson Hyperlegible","Ubuntu","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --line:#2f3a34; --ink:#e4ebe6; --muted:#9fb0a6;
  --juniper:#7cc4a7; --juniper-soft:#203a30; --dusk:#a6b4ee; --dusk-soft:#252c47;
  --warn:#f0b75c; --warn-soft:#3a2d16; --done:#66746c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --line:#2f3a34; --ink:#e4ebe6; --muted:#9fb0a6;
  --juniper:#7cc4a7; --juniper-soft:#203a30; --dusk:#a6b4ee; --dusk-soft:#252c47;
  --warn:#f0b75c; --warn-soft:#3a2d16; --done:#66746c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.2rem} h3{font-size:1rem}
.muted{color:var(--muted)} small{font-size:.85rem}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--juniper-soft);color:var(--juniper)}
button,.btn{font:inherit;cursor:pointer}
a{color:var(--juniper);font-weight:700}
.btn{background:var(--juniper);color:var(--surface);border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn.ghost{background:none;color:var(--juniper);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--dusk);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.stack{display:grid;gap:16px}
[hidden]{display:none !important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--juniper-soft);color:var(--juniper);font-weight:700}
.lite .sips,.lite .wbtns{gap:6px}.lite .sip,.lite .wbtns .btn{padding:5px 12px;min-height:34px;font-size:.95rem}.lite .wbar{height:8px}.lite .wtotal{font-size:1.05rem}.lite section.panel h2+span{font-size:.95rem}.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}.lbig{display:grid;gap:10px}.lbig .btn{font-size:1.15rem;padding:14px}.lpick{text-align:left;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:10px;background:none;font:inherit;color:inherit}.lpick.on{border-color:var(--juniper,#2f6b57);background:var(--juniper-soft,#e6f0ec)}
.dgrow{border-top:1px solid var(--line,#ddd);padding:10px 0}.dgrow:first-child{border-top:0}.dgrow>summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}.dgrow>summary::-webkit-details-marker{display:none}.dgrow .dgmore{margin-left:auto;font-size:.85rem}.dgrow>summary input{flex-shrink:0}
.chip.pending{background:var(--warn-soft);color:var(--warn)}
.chip.dusk{background:var(--dusk-soft);color:var(--dusk)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{display:grid;gap:2px}
.fact b{font-variant-numeric:tabular-nums}
.water{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.water .glasses{display:flex;gap:4px;flex-wrap:wrap}
.sips{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.sip{font:inherit;font-weight:700;font-size:1.25rem;min-height:64px;border-radius:14px;border:2px solid var(--juniper);background:var(--juniper-soft);color:var(--juniper);cursor:pointer;touch-action:manipulation}
.sip:active{background:var(--juniper);color:var(--surface)}
.wbar{height:14px;border-radius:999px;background:var(--juniper-soft);overflow:hidden}
.wbar>span{display:block;height:100%;background:var(--juniper);border-radius:999px}
.wtotal{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.face{font:inherit;display:grid;justify-items:center;gap:2px;padding:8px 2px;min-height:60px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;touch-action:manipulation}
.face span{font-size:1.6rem;line-height:1}.face small{font-size:.75rem;color:var(--muted)}
.face.on{border:2px solid var(--juniper);background:var(--juniper-soft)}
.feelrow{display:grid;gap:4px;margin-top:8px}
.scale{display:flex;gap:6px}.pip{font:inherit;font-weight:700;flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pip.on{background:var(--juniper);color:var(--surface);border-color:var(--juniper)}
.nudge{border-left:4px solid var(--dusk)}
.nudge select{width:auto}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.menu a,.menu button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:64px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-align:left;text-decoration:none;cursor:pointer}
.menu small{display:block;font-weight:400;color:var(--muted)}
.glass{width:22px;height:28px;border:2px solid var(--juniper);border-radius:3px 3px 6px 6px;background:none;padding:0}
.glass.full{background:var(--juniper)}
.next{border-left:4px solid var(--dusk);background:var(--dusk-soft);border-radius:8px;padding:10px 14px}
ol.day{list-style:none;margin:0;padding:0;display:grid}
ol.day>li{display:grid;grid-template-columns:76px 24px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
ol.day>li:first-child{border-top:0}
.t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--muted);padding-top:2px}
li.freezer .t,li.cook .t{color:var(--dusk)}
.item{min-width:0}
.item .title{font-weight:700}
.item .detail{color:var(--muted);font-size:.93rem}
.item ul{margin:4px 0 0;padding-left:18px}
li.is-done .title,li.is-done .detail{color:var(--done);text-decoration:line-through}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--juniper);margin:2px 0 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.93rem}
details.warnbox>summary{cursor:pointer;list-style-position:outside;margin-left:16px}
label{display:grid;gap:4px;font-weight:700;font-size:.93rem}
input[type="text"],input[type="time"],input[type="date"],input[type="number"],select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.supp{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.supp .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.supp .row label.inline{display:flex;gap:6px;align-items:center;font-weight:400}
.dayedit{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.dayedit:first-of-type{border-top:0;padding-top:0}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.qrcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.qrcard ol{margin:0;padding-left:20px;display:grid;gap:4px}
.qrcard code{font-size:.8rem;word-break:break-all;color:var(--muted)}
.qr{background:#ffffff;border-radius:8px;padding:8px;max-width:220px}
.qr svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700}
ol.day>li.is-missed .title{color:var(--warn)}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--juniper);font-weight:700;font-size:.9rem;cursor:pointer}
.labs{display:grid;gap:0}
.labrow{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.labrow:first-child{border-top:0}
.labval b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.visit{display:grid;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
ol.doc{margin:0;padding-left:22px;display:grid;gap:12px}
ol.doc>li{display:grid;gap:6px}
ol.doc select{width:auto}
@media print{
  body.printing-doc .wrap>header, body.printing-doc nav.tabs, body.printing-doc .noprint, body.printing-doc .toast{display:none!important}
  body.printing-doc main .stack>section:not(#doctorList){display:none!important}
  body.printing-doc .panel{border:0;padding:0}
}
@media print{
  body.printing-report .wrap>header, body.printing-report nav.tabs, body.printing-report .noprint, body.printing-report .toast{display:none!important}
  body.printing-report .panel{border:0;padding:0}
  body.printing-report{background:#fff;color:#000}
}
table.rep{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
table.rep th,table.rep td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep th{color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.glass{transition:background .15s}}

.qlist{display:grid;gap:8px}
.qrow{font:inherit;display:grid;grid-template-columns:32px 72px 1fr;align-items:center;gap:8px;text-align:left;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.qrow .qtick{width:28px;height:28px;border-radius:8px;border:2px solid var(--juniper);display:grid;place-items:center;font-weight:700;color:var(--surface)}
.qrow.on{background:var(--juniper-soft)}
.qrow.on .qtick{background:var(--juniper)}
.qrow.on .qn{color:var(--done);text-decoration:line-through}
.qrow .qt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.qrow .qn{font-weight:700;min-width:0}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>all systems you</h1>
    <span class="muted" id="syncNote"></span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="quick" aria-selected="false">Quick</button>
    <button role="tab" data-tab="lite" aria-selected="false">Lite</button>
    <button role="tab" data-tab="tomorrow" aria-selected="false">Tomorrow</button>
    <button role="tab" data-tab="more" aria-selected="false">More</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const LS_KEY = "dh-me-v1";

const APP_VERSION = "1.56.0";
const CHANGES = [
  {v:"1.56.0", date:"2026-11-28", items:["Your squash muffins (the 10/31 inulin version) and spiced sweet potato muffins (from your notes on the mini pumpkin muffin page) are in Breads and baking.","Recipe box: your handwritten squash muffin original, mini pumpkin muffins with your notes, pumpkin cassava pancakes, and the bagels' air-fryer step."]},
  {v:"1.55.0", date:"2026-11-28", items:["Recipe box: 11 more pages (breads, muffins, fudge, citrus salad, thyme pasta, pine needle trout, your buckwheat flatbread note).","High-altitude baking: set your altitude in the Recipe box and baked recipes show the changes (leavening, flour, liquid, sweetener, oven and time), from Colorado State University Extension and King Arthur Baking.","New: Breads and baking section, with your flax sweet potato bread and buckwheat flatbread. New dinner: Pine needle trout with greens."]},
  {v:"1.54.0", date:"2026-11-28", items:["Pantry > Meals > Recipe box: your printed recipes kept as written (for others, or for after the mold diet), with the source, what doesn't fit and why, your notes, and a link to your version.","\"Make my version\" on any recipe or meal opens it in Add my own meal to swap things and save as yours. Your own meals now have Edit.","Two more from your pages: Sesame chicken skillet and Herb seed crackers (thyme or sage in place of rosemary).","Buckwheat pancakes: vanilla taken out (it's on your avoid list). Vinegar now swaps to lime juice."]},
  {v:"1.53.0", date:"2026-11-28", items:["Four more from your printed recipes: Sesame ginger meatballs (batch) and a meatball bowl with a tahini-lime sauce, and Beef cheek barbacoa (batch, no chile in the base) with barbacoa bowls. The meatballs and barbacoa also work as breakfast meat in Build a meal."]},
  {v:"1.52.0", date:"2026-11-28", items:["Two recipes from your printed pages: Sweet potato toast with chicken and greens, and Buckwheat berry pancakes with patties (no maple syrup, chocolate or coconut). Both are dinners and both are off while Tier 2 is on.","\"Baking soda\" no longer trips the sweetened-drinks rule."]},
  {v:"1.51.0", date:"2026-11-28", items:["Meal checker: new \"Fix with any food\" button uses any food that fits your rules (your pantry first) and lists what to buy, with one tap to add them to your grocery list.","Snacks stay light: no added meat or cheese, a heavy snack gets trimmed and some cucumber, snap peas or greens.","New rule: protein per meal (30 g to start), so protein is spread out instead of piled on."]},
  {v:"1.50.2", date:"2026-11-28", items:["Fix this day: cheese is capped at about 2 portions a day, meat or fish comes first for protein, and no food is added to more than 2 meals."]},
  {v:"1.50.1", date:"2026-11-28", items:["Fix this day and Build a meal keep sweet and savory apart: no vegetables in a berry and chia breakfast, no fruit or chia in a savory meal. Breakfasts stay like your usual (meat or fish, cucumber or greens, lime, Pacha toast)."]},
  {v:"1.50.0", date:"2026-11-28", items:["Meal checker > Build and score a day: protein in grams for each meal and the day (estimates). Set a protein goal in My rules once your provider gives one, and Fix this day tops protein up too."]},
  {v:"1.49.1", date:"2026-11-28", items:["My rules: new Watch fat switch. Untick it and butter, ghee and sablefish stop being flagged, and the oil cap per meal is lifted."]},
  {v:"1.49.0", date:"2026-11-28", items:["Meal checker > Build and score a day: \"Fix this day from my pantry\" swaps out foods that break your rules or that you don't have, adds protein to carbs, then adds vegetables and fiber from your pantry inside your limits. Undo puts it back.","New goal: non-starchy vegetable servings a day (My rules, starts at 5)."]},
  {v:"1.48.4", date:"2026-11-28", items:["Tier 2: lime is marked \"check first\", and the lime question is on your doctor list."]},
  {v:"1.48.3", date:"2026-11-28", items:["Meal checker picks up rule changes (like Tier 2) as soon as you come back to it.","Build and score a day now flags foods from your own rules, flare-up mode and Tier 2, not just the built-in lists."]},
  {v:"1.48.2", date:"2026-11-28", items:["Pantry: Fill never adds meals that don't fit your rules. If no breakfast (or lunch...) fits, it says so instead.","Pantry picks up rule changes (like Tier 2) as soon as you come back to it."]},
  {v:"1.48.1", date:"2026-11-28", items:["\"Limit\" and \"Keep small\" are now called \"Keep occasional\"."]},
  {v:"1.48.0", date:"2026-11-28", items:["My rules > Mold diet: untick \"I'm on the mold diet\" when you're done, and the mold-only foods stop being flagged."]},
  {v:"1.47.0", date:"2026-11-28", items:["My rules: new Mold diet box. Tier 1 is always on; tick \"Also follow Tier 2\" to also avoid fruit, starchy vegetables, grains, fermented foods, shelled nuts, vinegar or sugar condiments and soured milk everywhere."]},
  {v:"1.46.1", date:"2026-11-28", items:["My rules: new \"Built-in lists\" box shows the mold diet (Break the Mold Tier 1), allergy and keep-small lists that are always on."]},
  {v:"1.46.0", date:"2026-11-28", items:["Pantry > Meals: \"Build a meal from what I have\" mixes a protein, vegetables, a starch and a flavor from what you ticked, using only foods that fit your rules. Save one and it joins your meals and Today's pantry picks.","Each meal card says which food rule it trips and why.","Chia berry jam is now Chia berry spread, so it isn't flagged as a sweet.","Grocery mode: Done shopping and ✕ sit below the iPhone clock, and the Grocery button reopens it."]},
  {v:"1.45.0", date:"2026-11-28", items:["Meals from your pantry: Today and Tomorrow pick lunch and dinner from what you have, and each meal says what it still needs.","Change a meal to see what each choice needs (ready, cook first, or need 2).","One tap puts the missing things on your grocery list. Grocery mode adds them to your pantry as they go in the cart.","Lite's Eating now shows the planned meal first."]},
  {v:"1.44.4", date:"2026-11-28", items:["The backup reminder (when your last backup is 2 or more days old) now shows on Lite and Today too, not just Quick."]},
  {v:"1.44.3", date:"2026-11-28", items:["Lite: slimmer water box with smaller buttons."]},
  {v:"1.44.2", date:"2026-11-28", items:["Lite: water looks and works like Quick (bar, your cup sizes, undo), and How you feel today sits right under it."]},
  {v:"1.44.1", date:"2026-11-28", items:["Quick no longer shows the \"Deleting this icon deletes your data\" warning. It's still under More, Phone settings, and the backup reminder still appears when a backup is due."]},
  {v:"1.44.0", date:"2026-11-28", items:["How you feel today is now on Quick and Lite too, the same faces as on Today.","Lite: removed the Pantry button at the bottom, since Pantry is on the bottom bar."]},
  {v:"1.43.1", date:"2026-11-28", items:["Set when you take each one: each supplement is its own folded row showing what it's set to, so you can scroll past to the one you want."]},
  {v:"1.43.0", date:"2026-11-28", items:["\"Set when you take each one\" is now the same folded panel on Today, Quick and Lite. Changes in one show in all three. To remove a supplement or change everything about it, the panel links to More, then Supplements & routine."]},
  {v:"1.42.1", date:"2026-11-28", items:["Lite: \"Add a supplement or powder\" can mark it Only as needed, with a most-per-day limit."]},
  {v:"1.42.0", date:"2026-11-28", items:["Lite: supplements can be set for 30 min or 1 h before a meal or bedtime. Lite counts down from that meal's planned time and shows it under Coming up, then Take now (with the banner and chime if the app is open)."]},
  {v:"1.41.1", date:"2026-11-27", items:["More > Phone settings (was Phone shortcuts): Start page has both \"open on Quick\" and \"open on Lite\", the same boxes as on those pages. In the home-screen app, the Shortcuts links are greyed out since they only work in Safari."]},
  {v:"1.41.0", date:"2026-11-27", items:["Fill in past days: on Today, tap \"‹ Day before\" to go back (up to 60 days). Tick the checklist, add water, log meals and as-needed doses for that day. \"Back to today\" returns."]},
  {v:"1.40.0", date:"2026-11-27", items:["Today, Quick and Lite stay in step both ways: ticking Kitchen closes, a meal, a glass of water or a supplement in one shows in the others, and unticking takes it back everywhere."]},
  {v:"1.39.1", date:"2026-11-27", items:["Fixed: \"Always open the app on Lite\" was ignored when opening from the home-screen icon, which always asked for Quick."]},
  {v:"1.39.0", date:"2026-11-27", items:["Alerts while the app is open: when a countdown (like 2 h after lunch) or a set reminder comes due, a banner shows with a chime, plus an iPhone notification if you allow them. Settings and a test button are on Lite under \"Alerts while the app is open\"."]},
  {v:"1.38.1", date:"2026-11-27", items:["Fixed: More no longer jumps to Lite. Pick one start page: \"Always open the app on Quick\" (on Quick) or \"on Lite\" (on Lite). Ticking one switches off the other. With neither ticked, the app opens on Today."]},
  {v:"1.38.0", date:"2026-11-27", items:["Lite: add a supplement or powder (like a fiber powder) right under \"Set when you take each one\", then tick when you take it."]},
  {v:"1.37.1", date:"2026-11-27", items:["Fixed: on iPhone, time pickers (wake up, bed, meal times, supplement times) closed after the first turn of the wheel. Now the time saves when you tap Done."]},
  {v:"1.37.0", date:"2026-11-27", items:["Lite is now a tab on the main bar, next to Today. The app opens on whichever of Lite or the other tabs you used last."]},
  {v:"1.36.1", date:"2026-11-27", items:["Fixed: supplements ticked on the full checklist now count as done in the Light view too."]},
  {v:"1.36.0", date:"2026-11-27", items:["Light view: \"Done eating for today\" ticks Kitchen closes in the full app.","Water you add ticks the Glass of water items on the checklist, one for each share of your goal."]},
  {v:"1.35.0", date:"2026-11-27", items:["Partial servings: pick ¼, ½, ¾, 1½ and so on for each food, or step with − and +."]},
  {v:"1.34.1", date:"2026-11-27", items:["Meals have a time you can change when you log them or tap Edit. Edit also lets you switch which meal it was. Supplement countdowns follow the time you set."]},
  {v:"1.34.0", date:"2026-11-27", items:["Eaten today shows on Today, Quick and the Light view, with Edit and Remove for each meal.","Saved meals can be changed: pick one, change foods or amounts, and tick \"Also update my saved meal\" (or update it without logging). You can also remove a saved meal."]},
  {v:"1.33.1", date:"2026-11-27", items:["Fixed: a food typed into \"Something not on the list\" now gets added with an Add button (or Enter) and the screen stays open. Typed foods stay on your list for next time, marked (yours)."]},
  {v:"1.33.0", date:"2026-11-27", items:["Log what you ate from both views: pick one of your meals (planned or your own) or tap pantry foods with amounts. Tick \"Save this as a meal\" and it shows under Your meals next time."]},
  {v:"1.32.0", date:"2026-11-26", items:["New: Light view (More, then Light view). Tap I'm up or Eating now and it shows what to take with that moment, counts down things like 2 h after lunch, and lets you log food from your pantry with amounts. Set when you take each supplement at the bottom of the Light view. The full app is one tap away."]},
  {v:"1.31.0", date:"2026-11-24", items:["My diagnoses lists every condition, including the ones your plan already covers, ticked. Each one is a single line you tap to open."]},
  {v:"1.30.0", date:"2026-11-24", items:["My diagnoses: add your own diagnosis with its name, foods to avoid or limit, and questions for your doctor."]},
  {v:"1.29.0", date:"2026-11-24", items:["New: My diagnoses, under More. Add a diagnosis any time. Fatty liver is the first: it flags alcohol, sugary drinks, juice, added sugar, refined starches, and fried or processed meat, and adds questions for your doctor. A draft list; turn off any food you want."]},
  {v:"1.28.0", date:"2026-11-24", items:["Pantry: pick the section when you add an item, and move items you added to another section with the menu next to them."]},
  {v:"1.27.0", date:"2026-11-24", items:["Pantry: \"local now\" follows the season. It's set for northern New Mexico (last frost June, first frost September). Change the frost months or when each item counts as local under \"Local now\" follows your season on the pantry page."]},
  {v:"1.26.0", date:"2026-11-24", items:["Quick: Change a meal. Swap one of today's meals, or type a new one. Meals you type are saved to your meal options so you can pick them again, here and in Change just today."]},
  {v:"1.25.0", date:"2026-11-24", items:["Warning boxes are now one line you can tap to open: the home-screen data warning and the spacing check."]},
  {v:"1.24.0", date:"2026-11-24", items:["Removed the Pending box and its labels from supplements and the checklist. Taking it now is what turns a supplement on or off."]},
  {v:"1.23.1", date:"2026-11-24", items:["Backup files are now named allsystemsyou-backup-(date). Older daily-helper backups still open the same way."]},
  {v:"1.23.0", date:"2026-11-24", items:["As needed supplements: tick As needed on a supplement and it leaves your checklist and reminders. Tap Took it on Today or Quick to log the time. You can set a most per day and get a warning when you reach it."]},
  {v:"1.22.3", date:"2026-11-24", items:["Supplements and routine: one Every day box instead of ticking each day. Untick it to pick days."]},
  {v:"1.22.2", date:"2026-11-24", items:["Supplements no longer ask Where. They go with you, so their reminders always come 10 and 5 minutes before (or whatever you set for at-home)."]},
  {v:"1.22.1", date:"2026-11-24", items:["Phone: updates now show up the next time you open the app, instead of getting stuck on the old version."]},
  {v:"1.22.0", date:"2026-11-24", items:["Phone: new setting to always open the app on Quick, with its one-tap buttons. It's on the Quick tab and under Phone shortcuts. If you leave the app for 5 minutes or more, it goes back to Quick."]},
  {v:"1.21.0", date:"2026-11-24", items:["Every other day: pick the first day you take it, instead of it always starting the day you turned it on.","How many times a day: take something 2, 3 or 4 times a day without picking clock times. Leave Times blank and it shows up that many times on your list to tick off."]},
  {v:"1.20.0", date:"2026-10-23", items:["Pantry finds more meals you can make: things you typed in count (kabocha covers squash, black cod covers sablefish, kale covers chard), and spices or oils you haven't ticked no longer hold a meal back. Meals that need a batch cook count as ready.","Meals that break your food rules move to their own group, stand-ins you avoid are skipped, and Fill leaves those meals out."]},
  {v:"1.19.1", date:"2026-10-23", items:["Optional bedtime tea reminder: Waxing Slumber (stevia-free batch), a small cup before bed. Off until you turn it on."]},
  {v:"1.19.0", date:"2026-10-23", items:["Your own teas: morning water now pairs with Neural Detox or Blood & Balm. Optional tea reminders (RootFire Brew, iced Vital Flow or Honeyed Love) are under Supplements & routine, off until you turn them on.","Two tea questions for your provider (astragalus, lemon balm) are on your doctor list.","Pantry: label items you saved now have an edit button, to add ingredients the photo missed. The checks run again.","Stevia is no longer suggested as a sweetener, and the checker flags chamomile."]},
  {v:"1.18.3", date:"2026-10-23", items:["Fix: with a second window or a paired phone open, a change (like Change just today) could say Saved and then disappear. Now changes from both are kept."]},
  {v:"1.18.2", date:"2026-10-22", items:["Fix: a time or note you were still typing is now kept if you close the window, switch away, or install an update."]},
  {v:"1.18.1", date:"2026-10-22", items:["Fix: an old window or a phone left open could write older data over your newer changes on the laptop. Now it picks up the newer changes instead."]},
  {v:"1.18.0", date:"2026-10-22", items:["Backups: new Combine with a backup file, to bring your phone and laptop copies together without losing either."]},
  {v:"1.17.1", date:"2026-10-22", items:["Installing an update on the laptop now saves a copy of your data first. Find it under More, then Backups."]},
  {v:"1.17.0", date:"2026-10-22", items:["New name: all systems you. Your data, settings and phone link stay the same."]},
  {v:"1.16.0", date:"2026-10-22", items:["Meal checker has a new \"Fix a meal\" tab: type a meal's ingredients and it suggests what to swap, trim and add."]},
  {v:"1.15.0", date:"2026-10-22", items:["Asks kindly about a supplement or routine step you haven't ticked off in a while: keep it, change how often, pause it or remove it.","Version number and this What's new list."]},
  {v:"1.14.0", date:"2026-10-21", items:["Bottom bar on every page (Today, Grocery, Pantry, Checker, More), so the iPhone home-screen app can always get back.","Meal tip reworded for mixed bowls."]},
  {v:"1.13.0", date:"2026-10-21", items:["Evening \"How did today feel?\" check-in.","Week look-back and Doctor visit pages you can print, save as PDF or download.","Daily backups with download and restore.","Grocery mode: tap items into your pantry at the store."]},
  {v:"1.12.0", date:"2026-10-21", items:["Tap +4 oz or +8 oz for water, with undo.","Simpler home: Today, Tomorrow, More.","Take a label photo straight from the phone."]},
  {v:"1.0 to 1.11", date:"2026-10-21", items:["First versions: reminders, supplements, meals, freezer pulls, cook day, notes, labs, my rules, missed items, daily clock, flare-up mode, one-day changes."]}

      if(!(k in theirs) && k in b) { if(!same(mine[k],b[k])) out[k]=mine[k]; continue; }

async function pushState(closing){
    saveTimer = null;
    if(!SERVER) return;
    try{
      let body = closing ? JSON.stringify({state:S, rev:SERVER_REV}) : "";
      const keepalive = closing && body.length < 60000;
      if(!keepalive) body = JSON.stringify({state:S, reminders:buildReminders(60), rev:SERVER_REV});
      const r = await fetch("/api/state",{method:"PUT",keepalive,headers:{"Content-Type":"application/json"},body});
      const j = await r.json().catch(()=>({}));
      if(r.status===409 && j.state){
        const theirs = merge(copyOf(j.state));
        S = merge(copyOf(merge3(BASE, S, theirs))); SERVER_REV = j.rev; BASE = copyOf(theirs); lsSet(S); render(); save();
        return;

  const m = String(t).toLowerCase().replace(/[\s.]/g,"").match(/^(\d{1,2})(?::?(\d{2}))?(am|pm|a|p)?$/);

}

function buildReminders(n){

    const d = addDays(now,i);
    for(const it of itemsFor(d).timed){
      if(it.skip) continue;
      const [h,m] = it.time.split(":").map(Number);
      for(const lead of leadsFor(it.where)){
        const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m - lead);
        const k = ymd(at)+"T"+pad(at.getHours())+":"+pad(at.getMinutes());
        const g = groups.get(k+"|"+lead) || {at:k, lead, time:it.time, items:[]};
        g.items.push(it); groups.set(k+"|"+lead, g);
      }
    }

  const out = [];
  for(const [key,g] of groups){
    const when = g.lead ? "In "+g.lead+" min ("+niceTime(g.time)+")" : niceTime(g.time);
    const title = when+": "+g.items.map(x=>x.title).join(", ");
    const body = g.items.map(x=> x.list ? x.list.join("\n") : (x.kind==="supp"? [x.title,x.detail].filter(Boolean).join(": ") : x.detail)).filter(Boolean).join("\n");
    out.push({key, at:g.at, title, body});

    const s = S.supplements.find(x=>x.id===it.suppId); if(!s) return {why:"Not on your list any more."};
    const gap = Number(S.rules.spacingMin)||120, food = withFood(s);
    const DT = dayTimes(now), meals = ["breakfast","lunch","dinner"].map(k=>parseTime(DT[k])).filter(Boolean).map(mins).sort((a,b)=>a-b);
    const clash = (day,m)=> itemsFor(parseYmd(day)).timed.find(o=>o.kind==="supp" && o.suppId!==s.id && (o.binder!==!!s.binder) && Math.abs(mins(o.time)-m)<gap);
    let day = today, m = null;

      while(m!==null){
        const c = clash(day,m); if(!c) break;
        const next = food ? meals.find(x=>x>m) : mins(c.time)+gap;
        m = (next===undefined || (!food && next>cut(M.suppCutoff))) ? null : Math.ceil(next/5)*5;
      }
      if(m===null){ day = ymd(addDays(parseYmd(day),1)); }
    }
    if(m===null) return {why:"No safe time in the next few days."};
    const at = abs(day,m);
    for(let k=0;k<3;k++){ const dd = addDays(parseYmd(today),k);
      if(!s.active || !dueOn(s,dd)) continue;
      for(const t of parseTimes(s.times)){ const x = abs(ymd(dd),mins(t));
        if(x>abs(srcDay,mins(it.time)) && Math.abs(x-at) < (Number(M.skipWithin)||0)) return {why:"Your next regular dose is "+whenText(ymd(dd),t)+", so skip this one."}; } }
    return {day, time:fromMins(m), why: food ? "Next meal" + (day===today?"":" (none left today)") : "Keeps "+Math.round(gap/6)/10+" h from "+(s.binder?"your other supplements":"psyllium")};
  }
  const r = (S.routine||[]).find(x=>x.id===it.routineId); if(!r) return {why:"Not on your list any more."};
  const town = (r.where||"home")==="town", cutoff = cut(town? M.townCutoff : M.homeCutoff);
  const daily = !r.alt && !(r.days&&r.days.length);
  if(srcDay===today && later(it.where)<=cutoff) return {day:today, time:fromMins(later(it.where)), why:"Later today"};
  if(daily) return {why: srcDay===today ? "Too late today. It's back on your list tomorrow." : "It's back on your list today."};
  const start = srcDay===today ? 1 : 0;
  for(let k=start;k<15;k++){
    const d = addDays(parseYmd(today),k), dn = DAYS_LONG[d.getDay()];
    if(k===0 && nowM>=cutoff) continue;
    if(dueOn(r,d)) return {why:"Your next regular one is "+(k===1?"tomorrow":k===0?"today":dn)+", so skip this one."};
    if(town){
      const others = (S.routine||[]).filter(o=>o.id!==r.id && o.active && o.where==="town");
      if(!others.length) return {day:ymd(d), time:it.time, why:"Next day (no other town days set)"};
      if(others.some(o=>dueOn(o,d))) return {day:ymd(d), time:it.time, why:"Your next town day"};
      continue;
    }
    if(dueOn(r,addDays(d,1))) return {why:"Your next regular one is "+DAYS_LONG[addDays(d,1).getDay()]+", and you want a day between."};

}

function sweepMissed(){
  const now = new Date(), after = Number(S.miss.after)||30; let changed = false;
  if(!S.missFrom){ S.missFrom = ymd(now); changed = true; }
  for(let k=2;k>=0;k--){
    const d = addDays(now,-k), key = ymd(d);
    if(key < (S.missFrom||key)) continue;
    for(const it of itemsFor(d).timed){
      if(!missable(it) || it.skip) continue;
      const due = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ...it.time.split(":").map(Number));
      if(now - due < after*60000) continue;
      const lg = S.log[key]; if(lg && (lg.done[it.id] || (lg.missed||{})[it.id])) continue;

}

function fmtQ(q){ q = Number(q)||0; const w = Math.floor(q), f = Math.round((q-w)*4); const fr = ["","¼","½","¾"][f]||""; return (w?String(w):"")+fr || "0"; }

function liteSupps(key){
  const d = parseYmd(key), lg = S.log[key]||{}, ev = lg.ev||{}, done = lg.lite||{}, fdone = lg.done||{}, out = [];
  const {timed, untimed} = itemsFor(d), full = [...timed, ...untimed];
  for(const s of S.supplements){
    if(!s.active || s.asNeeded || !dueOn(s,d)) continue;
    const ws = s.whens||[], h = Number(s.afterH)||0, mine = [];
    if(!ws.length) mine.push({s, a:"", k:s.id+"@any", due:null, h:0, done:!!done[s.id+"@any"]});
    for(const a of ws){ const at = ev[a]; let due, hh = h;
      if(h<0 && a!=="wake"){ const pl = litePlanned(a, d); due = pl!=null ? pl+Math.round(h*60) : null; if(at) due = due==null ? mins(at) : Math.min(due, mins(at)); }
      else { if(h<0) hh = 0; due = at ? mins(at)+Math.round(hh*60) : null; }
      mine.push({s, a, k:s.id+"@"+a, due, h:hh, done:!!done[s.id+"@"+a]}); }
    
    const fi = full.filter(i=>i.id==="supp:"+s.id || i.id.startsWith("supp:"+s.id+":")), fd = fi.filter(i=>fdone[i.id]).length;
    let extra = (fi.length && fd===fi.length) ? mine.length : fd - mine.filter(x=>x.done).length;
    for(const x of mine) if(extra>0 && !x.done){ x.done = true; x.viaFull = true; extra--; }
    out.push(...mine);
  }
  return out;
}

function liteIn(m){ const n = Math.max(0, m - liteNowM()), h = Math.floor(n/60); return "in "+(h?h+" h ":"")+(n%60)+" min"; }

    LITE = {eat:a.m, pick:{}, other:"", meal:a.meal||"", edit:+t.dataset.liteedit, time:a.t, day:(key===ymd(new Date())?"":key)}; for(const x of a.items) LITE.pick[x.id||("n:"+x.n)] = (LITE.pick[x.id||("n:"+x.n)]||0)+(x.q||1);

    liteReset(); save(); render(); window.scrollTo(0,0); toast(kept ? "Saved, and \u201c"+kept+"\u201d is now one of your meals." : (TAB==="lite" ? "Saved. What goes with it is at the top." : "Saved.")); return true; }

  return false;
}

async function saveFile(name, text, type){
  if(!SERVER && location.protocol!=="file:" && window.claude && window.claude.use){
    const dl = await window.claude.use("downloads").catch(()=>null);
    if(dl){ try{ await dl.save({filename:name, data:text}); toast("Saved "+name); }catch(e){ if(e && e.code!=="declined") toast("Couldn't save the file here"); } return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

function dailyLocalBackup(){
  try{ const list = localBackups(); if(list.some(b=>b.day===ymd(new Date()))) return;
    list.push(snapshot()); while(list.length>7) list.shift(); localStorage.setItem(LOCAL_BACKUPS, JSON.stringify(list)); }catch(_){}
}
let RESTORE_ASK = null, SERVER_DAYS = null;
async function restoreFrom(b){
  if(!b || !b.state || typeof b.state!=="object") { toast("That isn't an all systems you backup"); return; }
  S = merge(b.state); save();
  const pv = b.kv && b.kv["pantryplanner.v1"];
  if(pv){ try{ localStorage.setItem("pantryplanner.v1", pv); }catch(_){}
    if(SERVER) try{ await fetch("/api/kv/pantryplanner.v1",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:pv})}); }catch(_){} }
  RESTORE_ASK = null; toast("Restored your data from "+(b.day||"the file")); TAB="today"; render();
}

async function combineFrom(b){
  if(!b || !b.state || typeof b.state!=="object") { toast("That isn't an all systems you backup"); return; }
  const o = merge(b.state); let days = 0, items = 0;
  for(const [k,ol] of Object.entries(o.log||{})){
    const sl = S.log[k];
    if(!sl){ S.log[k] = ol; days++; continue; }
    sl.done = Object.assign({}, ol.done||{}, sl.done||{});
    if((Number(ol.oz)||0) > (Number(sl.oz)||0)){ sl.oz = ol.oz; sl.sips = ol.sips||[]; }
    if(ol.feel) sl.feel = Object.assign({}, ol.feel, sl.feel||{});
    if(ol.missed) sl.missed = Object.assign({}, ol.missed, sl.missed||{});
    if(ol.cooked && !sl.cooked) sl.cooked = ol.cooked;
    days++;
  }
  for(const f of ["notes","doctor","labs","visits","moved","supplements","routine"]){
    const have = new Set((S[f]||[]).map(x=>x.id));
    for(const x of (o[f]||[])) if(x && x.id && !have.has(x.id)){ (S[f]=S[f]||[]).push(x); items++; }
  }
  for(const [k,v] of Object.entries(o.dayOver||{})) if(!(S.dayOver||{})[k]) (S.dayOver=S.dayOver||{})[k] = v;
  save();
  const pv = b.kv && b.kv["pantryplanner.v1"];
  if(pv){ try{ const a = JSON.parse(pv), cur = JSON.parse(localStorage.getItem("pantryplanner.v1")||"null");
    let out = a;
    if(cur){ out = Object.assign({}, cur); out.pantry = Object.assign({}, a.pantry||{}, cur.pantry||{}); out.got = Object.assign({}, a.got||{}, cur.got||{});
      const ids = new Set((cur.custom||[]).map(x=>x.id)); out.custom = [...(cur.custom||[]), ...(a.custom||[]).filter(x=>!ids.has(x.id))]; }
    const v = JSON.stringify(out); localStorage.setItem("pantryplanner.v1", v);
    if(SERVER) await fetch("/api/kv/pantryplanner.v1",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:v})});
  }catch(_){} }
  toast(`Combined: ${days} day${days===1?"":"s"} and ${items} note${items===1?"":"s"}, questions or items added`); TAB="today"; render();
}

const FEEL_WORD = {1:"Rough",2:"Low",3:"OK",4:"Good",5:"Great"};
function dayRow(d){
  const key = ymd(d), lg = S.log[key]||{done:{}}, its = itemsFor(d).timed.filter(i=>!i.skip && i.kind!=="water" && i.kind!=="feel");
  const done = its.filter(i=>lg.done[i.id]).length, f = lg.feel||{};
  const notes = (S.notes||[]).filter(n=>n.date===key);
  const has = !!S.log[key]; // no log means the app wasn't used that day: leave it out of averages
  return {key, d, done, total:its.length, pct: has&&its.length?Math.round(done/its.length*100):null,
    oz: has ? Number(lg.oz ?? (Number(lg.water)||0)*(Number(S.glassOz)||16))||0 : null, feel:f,
    bm: Object.keys(lg.done).some(k=>k.startsWith("rt:bm")), flare: flareOn(d), fiber: fiberInfo(d).w,
    missed: notes.filter(n=>n.missed), notes: notes.filter(n=>!n.missed)};
}
function rangeRows(end, n){ const out=[]; for(let i=n-1;i>=0;i--) out.push(dayRow(addDays(end,-i))); return out; }
const avg = a=>{ const v=a.filter(x=>x!=null&&x!==""); return v.length? Math.round(v.reduce((s,x)=>s+Number(x),0)/v.length*10)/10 : null; };
function summary(rows){
  const goal = Number(S.waterGoal)||80;
  return {days: rows.length, pct: avg(rows.map(r=>r.pct)), oz: avg(rows.map(r=>r.oz)), goalDays: rows.filter(r=>r.oz!=null&&r.oz>=goal).length, used: rows.filter(r=>r.pct!=null||r.oz!=null).length,
    overall: avg(rows.map(r=>r.feel.overall)), energy: avg(rows.map(r=>r.feel.energy)), mood: avg(rows.map(r=>r.feel.mood)), gut: avg(rows.map(r=>r.feel.gut)),
    sleep: avg(rows.map(r=>r.feel.sleep)), symptoms: avg(rows.map(r=>r.feel.symptoms)), bm: rows.filter(r=>r.bm).length, flare: rows.filter(r=>r.flare).length,
    missed: rows.reduce((s,r)=>s+r.missed.length,0)};
}
const dLabel = d=> DAYS[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate();
const csvCell = v=>{ v = v==null?"":String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
function rowsCsv(rows){
  const head = ["Date","Checklist done","Checklist total","Checklist %","Water oz","Water goal oz","Overall","Energy","Mood","Digestion","Sleep","Symptoms (5 = none)","Bowel check done","Flare-up mode","Fiber week","Feeling note","Missed","Notes"];
  const lines = [head, ...rows.map(r=>[r.key, r.done, r.total, r.pct, r.oz, S.waterGoal, r.feel.overall, r.feel.energy, r.feel.mood, r.feel.gut, r.feel.sleep, r.feel.symptoms,
    r.bm?"yes":"no", r.flare?"yes":"no", r.fiber, r.feel.note||"", r.missed.map(n=>n.about+": "+n.text).join(" | "), r.notes.map(n=>(n.about?n.about+": ":"")+n.text+(n.feel?" ("+n.feel+")":"")).join(" | ")])];
  return lines.map(l=>l.map(csvCell).join(",")).join("\r\n");
}
function sumLines(sm){
  const b = [];
  b.push(`Checklist: ${sm.pct??"-"}% done on average`);
  b.push(`Water: ${sm.oz??0} oz a day on average (goal ${S.waterGoal} oz), goal reached ${sm.goalDays} of ${sm.used} days`);
  if(sm.used<sm.days) b.push(`Days with no app use: ${sm.days-sm.used}`);
  if(sm.overall!=null) b.push(`How I felt (1 to 5): overall ${sm.overall}`+[["energy","energy"],["mood","mood"],["gut","digestion"],["sleep","sleep"],["symptoms","symptoms (5 = none)"]].filter(([k])=>sm[k]!=null).map(([k,n])=>`, ${n} ${sm[k]}`).join(""));

  if(sm.flare) b.push(`Flare-up mode (no arginine foods): ${sm.flare} of ${sm.days} days`);
  if(sm.missed) b.push(`Missed items: ${sm.missed}`);
  return b;
}

function visitData(){

  const labs = []; const seen = new Set();
  for(const x of [...(S.labs||[])].sort((a,b)=>b.date.localeCompare(a.date))){ if(seen.has(x.name)) continue; seen.add(x.name);

  return {rows, sm, open, supps, labs};
}

function nudgeList(){
  const N = S.nudge||{}, today = parseYmd(ymd(new Date()));
  if(N.on===false) return [];
  const used = Object.keys(S.log).filter(k=>Object.keys((S.log[k]||{}).done||{}).length || (S.log[k]||{}).oz).sort();
  if(!used.length) return [];
  const first = parseYmd(used[0]), out = [];
  const lastDone = (kind,id)=>{ const re = new RegExp("(^|:)"+kind+":"+id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(:|$)");
    let best = null; for(const [k,lg] of Object.entries(S.log)) if(Object.keys(lg.done||{}).some(x=>re.test(x)) && (!best||k>best)) best = k; return best; };
  const check = (x, kind, what)=>{
    if(!x.active) return;
    const n = x.nudgeDays==null ? Number(N.days)||7 : Number(x.nudgeDays); if(!n) return;
    const key = kind+":"+x.id; if((N.snooze||{})[key] && N.snooze[key] > ymd(today)) return;
    const ld = lastDone(kind, x.id), from = ld ? parseYmd(ld) : first;
    const gap = Math.round((today - from)/86400000); if(gap < n) return;
    let due = 0; for(let i=1;i<=gap;i++) if(dueOn(x, addDays(from,i))) due++;
    if(due < 2) return;
    out.push({key, x, kind, what, gap, never:!ld});
  };
  for(const r of S.routine||[]) check(r, "rt", "routine");
  for(const s of S.supplements||[]) check(s, "supp", "supplement");
  return out.sort((a,b)=>b.gap-a.gap);
}

let PH = null;
function loadQr(){
  return new Promise(res=>{ if(window.qrcode) return res(); const sc=document.createElement("script"); sc.src="/qr.js"; sc.onload=()=>res(); sc.onerror=()=>res(); document.head.appendChild(sc); });
}
function qrSvg(url){
  if(!window.qrcode) return "";
  const q = qrcode(0,"M"); q.addData(url); q.make();
  return q.createSvgTag({cellSize:5, margin:3, scalable:true});
}

function labFlag(x){
  if(x.value==null || x.value==="") return "";
  if(x.high!=null && x.high!=="" && +x.value>+x.high) return x.low==null||x.low===""? "Present" : "High";
  if(x.low!=null && x.low!=="" && +x.value<+x.low) return "Low";
  return "In range";
}

function icsText(){
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//all systems you//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:all systems you"];
  const today = new Date(), stamp = ymd(today).replace(/-/g,"")+"T000000Z";
  const escI = s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);
  const ev = (uid, date, time, title, body, rrule, where)=>{
    lines.push("BEGIN:VEVENT","UID:"+uid+"@daily-helper","DTSTAMP:"+stamp,
      "DTSTART:"+ymd(date).replace(/-/g,"")+"T"+time.replace(":","")+"00","DURATION:PT10M",
      "SUMMARY:"+escI(title), "DESCRIPTION:"+escI(body||""), "RRULE:"+rrule);
    for(const lead of leadsFor(where)) lines.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(title),"TRIGGER:-PT"+lead+"M","END:VALARM");
    lines.push("END:VEVENT");
  };
  const perDay = i=>i.kind==="meal"||i.id==="snack"||i.id==="treat"||i.weekly;
  const daily = itemsFor(today,true).timed.filter(i=>i.kind!=="freezer" && i.kind!=="cook" && !perDay(i));
  daily.forEach(i=>ev(i.id.replace(/[^a-z0-9]/gi,"-"), today, i.time, i.title, i.detail, "FREQ=DAILY", i.where));
  for(let k=0;k<7;k++){
    const d = addDays(today,k), byday = ["SU","MO","TU","WE","TH","FR","SA"][d.getDay()];
    const its = itemsFor(d,true).timed;
    its.filter(perDay).forEach(i=>ev(i.id.replace(/[^a-z0-9]/gi,"-")+"-"+byday, d, i.time, i.title, i.detail, "FREQ=WEEKLY;BYDAY="+byday, i.where));
    const alt = !!cookSession(addDays(d,1));
    for(const wk of (alt?[0,7]:[0])){
      const dd = addDays(d,wk), p = itemsFor(dd,true).timed.find(i=>i.kind==="freezer");
      if(p) ev("pull-"+byday+(alt?"-"+ymd(dd):""), dd, p.time, p.title, p.list.join("\n"), alt?"FREQ=WEEKLY;INTERVAL=2":"FREQ=WEEKLY;BYDAY="+byday);
    }
    for(const wk of [0,7]){
      const dd = addDays(d,wk), c = itemsFor(dd,true).timed.find(i=>i.kind==="cook");
      if(c) ev("cook-"+ymd(dd), dd, c.time, c.title, c.detail, "FREQ=WEEKLY;INTERVAL=2");
    }
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function alertNow(title, body){
  if(S.alertsOn===false) return;
  let bar = document.getElementById("dueBanner");
  if(!bar){ bar = document.createElement("div"); bar.id = "dueBanner"; bar.setAttribute("role","alert");
    bar.style.cssText = "position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;background:var(--juniper,#2f6b57);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:600";
    document.body.appendChild(bar); }
  const prev = bar.dataset.lines ? JSON.parse(bar.dataset.lines) : [];
  prev.push(title + (body ? " · " + body : "")); bar.dataset.lines = JSON.stringify(prev.slice(-4));
  bar.innerHTML = `<div>${prev.slice(-4).map(x=>`<div>${esc(x)}</div>`).join("")}</div><button type="button" style="background:#fff;color:#1d3b31;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700">OK</button>`;
  bar.querySelector("button").onclick = ()=>bar.remove();
  chime(); try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(_){}
  if("Notification" in window && Notification.permission==="granted"){
    const opts = {body: body||"", tag: "dh-"+title};
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r=>{ if(r && r.showNotification) r.showNotification(title, opts); else { try{ new Notification(title, opts); }catch(_){} } }).catch(()=>{});
    else { try{ new Notification(title, opts); }catch(_){} }
  }
}

let QUICK_FLASH = "";
function pGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function pSet(k,v){ try{ localStorage.setItem(k,v); }catch(_){} }

function needsSetup(){ return PHX.welcome && !pGet("dh.welcomed") && !(S.supplements||[]).length; }
function appUrl(q){ return location.origin + location.pathname.replace(/[^/]*$/, "") + (q||""); }
function daysSinceBackup(){ const d = parseYmd(pGet("dh.lastBackup")||""); return d ? Math.round((parseYmd(ymd(new Date())) - d)/864e5) : null; }


function quickItems(d){
  const {timed, untimed} = itemsFor(d||new Date());
  const all = timed.concat(untimed);
  return {meals: all.filter(i=>i.kind==="meal"||i.id==="snack"||i.id==="treat"), supps: all.filter(i=>i.kind==="supp")};
}
const MEAL_IDS = {b:"meal:b", l:"meal:l", d:"meal:d", s:"snack", e:"treat"};
function minutesNow(){ const n = new Date(); return n.getHours()*60+n.getMinutes(); }
function markDone(key, id){ const lg = dayLog(key); lg.done[id] = true; undoMissed(key, id); }


function runAction(p){
  const act = p.get("do"); if(!act) return "";
  const key = ymd(new Date()), lg = dayLog(key), {meals, supps} = quickItems(new Date());
  if(act==="water"){
    const n = Number(p.get("oz")) || PHX.firstSize();
    PHX.addWater(lg, n);
    return "Added "+n+" oz. "+PHX.waterText(lg)+".";
  }
  if(act==="supps"){
    const due = supps.filter(i=>i.time && !lg.done[i.id] && mins(i.time) <= minutesNow()+60);
    due.forEach(i=>markDone(key, i.id));
    return due.length ? "Checked off "+due.map(i=>i.title).join(", ")+"." : "Nothing due right now. Tick the ones you took below.";
  }
  if(act==="meal"){
    const m = p.get("m")||"next";
    let it = m==="next" ? meals.filter(i=>!lg.done[i.id] && i.time && mins(i.time) <= minutesNow()+90).pop() || meals.find(i=>!lg.done[i.id]) : meals.find(i=>i.id===MEAL_IDS[m]);
    if(!it) return m==="next" ? "All of today's meals are already ticked." : "That meal isn't on today's list.";
    markDone(key, it.id); return "Done: "+it.title+".";
  }
  if(act==="feel"){
    const v = Math.max(1, Math.min(5, Number(p.get("v"))||3));
    lg.feel = Object.assign({}, lg.feel, {overall:v}); lg.done[PHX.feelId] = true;
    return "Today feels "+["rough","low","OK","good","great"][v-1]+". Saved.";
  }
  if(act==="done" && p.get("id")){ markDone(key, p.get("id")); return "Checked off."; }
  return "";
}
function phoneAfterLoad(){
  const p = new URLSearchParams(location.search);
  if(p.get("do")){ QUICK_FLASH = runAction(p); TAB = "quick"; save(); }
  if(p.get("view")==="quick") TAB = "quick";
  
  const asked = window.HASH_TAB || (["today","tomorrow","more","lite"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "");
  const openOn = pGet("dh.openOn");
  if(p.get("view") || p.get("do")) window.FROM_SHORTCUT = true;
  if(needsSetup()) TAB = "quick"; else if(!asked && !p.get("view") && !p.get("do") && (openOn==="quick" || (openOn==="lite" && typeof renderLite==="function"))) TAB = openOn;
  if(location.search) history.replaceState(null, "", location.pathname + (TAB==="quick" ? "#quick" : ""));
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator){
    const had = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(had && !reloading){ reloading = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js").then(reg=>{
      document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  }
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ hiddenAt = Date.now(); return; }
    const on = pGet("dh.openOn");
    if((on==="quick" || (on==="lite" && typeof renderLite==="function")) && hiddenAt && Date.now()-hiddenAt > 5*60000 && TAB!==on && !document.querySelector("input:focus,textarea:focus")){ TAB = on; render(); window.scrollTo(0,0); }

}

function phoneSave(download){
  return async function(name, text, type){
    if(/\.json$/.test(name)) pSet("dh.lastBackup", ymd(new Date()));
    if(TOUCH && navigator.canShare){
      const f = new File([text], name, {type:type||"text/plain"});
      if(navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f], title:name}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
    }
    return download(name, text, type);
  };
}
