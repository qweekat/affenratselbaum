<style>
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#d9dfd8; --ink:#1d2a24; --muted:#5b6b62;
  --juniper:#2f6b57; --juniper-soft:#e1eee8; --dusk:#3d4f8a; --dusk-soft:#e6e9f5;
  --warn:#9a5b00; --warn-soft:#fbf0dc; --done:#8a978f;
  --display:"Literata",Georgia,"DejaVu Serif",serif;
  --body:"Atkinson Hyperlegible","Ubuntu","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --line:#2f3a34; --ink:#e4ebe6; --muted:#9fb0a6;
  --juniper:#7cc4a7; --juniper-soft:#203a30; --dusk:#a6b4ee; --dusk-soft:#252c47;
  --warn:#f0b75c; --warn-soft:#3a2d16; --done:#66746c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --line:#2f3a34; --ink:#e4ebe6; --muted:#9fb0a6;
  --juniper:#7cc4a7; --juniper-soft:#203a30; --dusk:#a6b4ee; --dusk-soft:#252c47;
  --warn:#f0b75c; --warn-soft:#3a2d16; --done:#66746c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.7rem} h2{font-size:1.2rem} h3{font-size:1rem}
.muted{color:var(--muted)} small{font-size:.85rem}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--juniper-soft);color:var(--juniper)}
button,.btn{font:inherit;cursor:pointer}
a{color:var(--juniper);font-weight:700}
.btn{background:var(--juniper);color:var(--surface);border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn.ghost{background:none;color:var(--juniper);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--dusk);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.stack{display:grid;gap:16px}
[hidden]{display:none !important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--juniper-soft);color:var(--juniper);font-weight:700}
.chip.pending{background:var(--warn-soft);color:var(--warn)}
.chip.dusk{background:var(--dusk-soft);color:var(--dusk)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{display:grid;gap:2px}
.fact b{font-variant-numeric:tabular-nums}
.water{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.water .glasses{display:flex;gap:4px;flex-wrap:wrap}
.sips{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.sip{font:inherit;font-weight:700;font-size:1.25rem;min-height:64px;border-radius:14px;border:2px solid var(--juniper);background:var(--juniper-soft);color:var(--juniper);cursor:pointer;touch-action:manipulation}
.sip:active{background:var(--juniper);color:var(--surface)}
.wbar{height:14px;border-radius:999px;background:var(--juniper-soft);overflow:hidden}
.wbar>span{display:block;height:100%;background:var(--juniper);border-radius:999px}
.wtotal{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.face{font:inherit;display:grid;justify-items:center;gap:2px;padding:8px 2px;min-height:60px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;touch-action:manipulation}
.face span{font-size:1.6rem;line-height:1}.face small{font-size:.75rem;color:var(--muted)}
.face.on{border:2px solid var(--juniper);background:var(--juniper-soft)}
.feelrow{display:grid;gap:4px;margin-top:8px}
.scale{display:flex;gap:6px}.pip{font:inherit;font-weight:700;flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pip.on{background:var(--juniper);color:var(--surface);border-color:var(--juniper)}
.nudge{border-left:4px solid var(--dusk)}
.nudge select{width:auto}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.menu a,.menu button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:64px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-align:left;text-decoration:none;cursor:pointer}
.menu small{display:block;font-weight:400;color:var(--muted)}
.glass{width:22px;height:28px;border:2px solid var(--juniper);border-radius:3px 3px 6px 6px;background:none;padding:0}
.glass.full{background:var(--juniper)}
.next{border-left:4px solid var(--dusk);background:var(--dusk-soft);border-radius:8px;padding:10px 14px}
ol.day{list-style:none;margin:0;padding:0;display:grid}
ol.day>li{display:grid;grid-template-columns:76px 24px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
ol.day>li:first-child{border-top:0}
.t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--muted);padding-top:2px}
li.freezer .t,li.cook .t{color:var(--dusk)}
.item{min-width:0}
.item .title{font-weight:700}
.item .detail{color:var(--muted);font-size:.93rem}
.item ul{margin:4px 0 0;padding-left:18px}
li.is-done .title,li.is-done .detail{color:var(--done);text-decoration:line-through}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--juniper);margin:2px 0 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.93rem}
label{display:grid;gap:4px;font-weight:700;font-size:.93rem}
input[type="text"],input[type="time"],input[type="date"],input[type="number"],select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.supp{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.supp .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.supp .row label.inline{display:flex;gap:6px;align-items:center;font-weight:400}
.dayedit{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.dayedit:first-of-type{border-top:0;padding-top:0}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.qrcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.qrcard ol{margin:0;padding-left:20px;display:grid;gap:4px}
.qrcard code{font-size:.8rem;word-break:break-all;color:var(--muted)}
.qr{background:#ffffff;border-radius:8px;padding:8px;max-width:220px}
.qr svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700}
ol.day>li.is-missed .title{color:var(--warn)}
.linkbtn{background:none;border:0;padding:4px 0 0;color:var(--juniper);font-weight:700;font-size:.9rem;cursor:pointer}
.labs{display:grid;gap:0}
.labrow{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.labrow:first-child{border-top:0}
.labval b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.visit{display:grid;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
ol.doc{margin:0;padding-left:22px;display:grid;gap:12px}
ol.doc>li{display:grid;gap:6px}
ol.doc select{width:auto}
@media print{
  body.printing-doc .wrap>header, body.printing-doc nav.tabs, body.printing-doc .noprint, body.printing-doc .toast{display:none!important}
  body.printing-doc main .stack>section:not(#doctorList){display:none!important}
  body.printing-doc .panel{border:0;padding:0}
}
@media print{
  body.printing-report .wrap>header, body.printing-report nav.tabs, body.printing-report .noprint, body.printing-report .toast{display:none!important}
  body.printing-report .panel{border:0;padding:0}
  body.printing-report{background:#fff;color:#000}
}
table.rep{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
table.rep th,table.rep td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep th{color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.glass{transition:background .15s}}

.qlist{display:grid;gap:8px}
.qrow{font:inherit;display:grid;grid-template-columns:32px 72px 1fr;align-items:center;gap:8px;text-align:left;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.qrow .qtick{width:28px;height:28px;border-radius:8px;border:2px solid var(--juniper);display:grid;place-items:center;font-weight:700;color:var(--surface)}
.qrow.on{background:var(--juniper-soft)}
.qrow.on .qtick{background:var(--juniper)}
.qrow.on .qn{color:var(--done);text-decoration:line-through}
.qrow .qt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.qrow .qn{font-weight:700;min-width:0}
</style>
</head>

function merge3(base, mine, theirs){
  const same = (a,b)=>JSON.stringify(a)===JSON.stringify(b);

  if(same(theirs,base) || mine===undefined || theirs===undefined) return mine;
  const isObj = x=>x && typeof x==="object" && !Array.isArray(x);
  if(isObj(mine) && isObj(theirs)){
    const b = isObj(base)?base:{}, out = {};
    for(const k of new Set([...Object.keys(mine),...Object.keys(theirs)])){
      if(!(k in mine) && k in b) { if(!same(theirs[k],b[k])) out[k]=theirs[k]; continue; }   // I removed it, they didn't touch it
      if(!(k in theirs) && k in b) { if(!same(mine[k],b[k])) out[k]=mine[k]; continue; }
      const v = merge3(b[k], mine[k], theirs[k]); if(v!==undefined) out[k]=v; }
    return out;
  }

    const b = ids(base)?base:[], inBase = new Set(b.map(x=>x.id)), inMine = new Set(mine.map(x=>x.id));
    const bById = Object.fromEntries(b.map(x=>[x.id,x])), tById = Object.fromEntries(theirs.map(x=>[x.id,x]));

    for(const x of theirs) if(!inMine.has(x.id) && !inBase.has(x.id)) out.push(x);

  }

}

function usageOn(d){
  const ids = idsFor(d), out = {};
  const addU = m=>{ for(const [k,v] of Object.entries(m||{})) out[k]=(out[k]||0)+v; };
  for(const [k] of SLOTS) if(ids[k]!=="l_thermos") addU(USES[ids[k]]);
  if(flareOn(d)){ delete out.r_beans; delete out.r_chiajam; }
  if(ids.l==="l_thermos"){ 
    const prev = USES[idsFor(addDays(d,-1)).d]||{};
    const stew = Object.keys(prev).find(k=>k==="r_chickenstew"||k==="r_lambstew"||k==="r_bison");
    if(stew) out[stew]=(out[stew]||0)+1;
  }
  return out;
}
function usageBetween(from, days){ const t={}; for(let i=0;i<days;i++){ for(const [k,v] of Object.entries(usageOn(addDays(from,i)))) t[k]=(t[k]||0)+v; } return t; }
function nextCookDate(from){ for(let i=0;i<8;i++){ const d=addDays(from,i); if(d.getDay()===Number(S.cookDay) && !(S.log[ymd(d)]||{}).cooked) return parseYmd(ymd(d)); } return null; }

function cookPlanFor(cd){
  const today = parseYmd(ymd(new Date()));
  if(cd < today) cd = today;
  const before = usageBetween(today, Math.round((cd-today)/86400000));
  const need = usageBetween(cd, 7), items = [];
  for(const [id,b] of Object.entries(BASES)){
    const have = Math.max(0, (Number((S.stock||{})[id])||0) - (before[id]||0));
    const n = need[id]||0;
    if(n > have){ const batches = Math.ceil((n-have)/b.yield); items.push({id, batches, need:n, have}); }
  }
  const g = items.find(x=>x.id==="r_grain");
  if(g) g.grain = S.lastGrain==="quinoa" ? "buckwheat" : "quinoa";
  return items;
}
function baseName(it){ const b=BASES[it.id]; if(it.id==="r_grain") return it.grain==="buckwheat"?"Buckwheat groats pot":"Quinoa pot"; return b.n; }
function baseMin(it){ return it.id==="r_grain" && it.grain==="buckwheat" ? 12 : BASES[it.id].min; }

function cookTimeline(items){
  const burners=[0,0], steps=[]; let oven=0;
  const stove = items.filter(x=>BASES[x.id].where==="stove").sort((a,b)=>baseMin(b)-baseMin(a));
  for(const it of stove) for(let k=0;k<it.batches;k++){ const i = burners[0]<=burners[1]?0:1; steps.push({at:burners[i], where:"Burner "+(i+1), it}); burners[i]+=baseMin(it); }
  for(const it of items.filter(x=>BASES[x.id].where==="oven")) for(let k=0;k<it.batches;k++){ steps.push({at:oven, where:"Oven", it}); oven+=baseMin(it)+5; }
  const end = Math.max(burners[0], burners[1], oven);
  for(const it of items.filter(x=>BASES[x.id].where==="none")) steps.push({at:Math.max(0,end-15), where:"No heat", it});
  return {steps: steps.sort((a,b)=>a.at-b.at||a.where.localeCompare(b.where)), end};
}
const hm = m=> Math.floor(m/60)+":"+pad(m%60);
function cookSummary(items){
  if(!items.length) return "Your freezer covers next week. Nothing to cook.";
  const {end} = cookTimeline(items);
  return "About "+(Math.round(end/15)/4)+" hours: "+items.map(it=>baseName(it).replace(/^(Quinoa|Buckwheat groats) pot$/,"$1").replace(/^Anasazi or bolita bean pot$/,"bean pot")+(it.batches>1?" x"+it.batches:"")).join(", ")+".";
}

}

function spacingWarnings(){

      if(gap<(Number((S.rules||{}).spacingMin)||120)) out.push(b.name+" at "+niceTime(tb)+" is "+(gap? gap+" min" : "at the same time as")+(gap?" from ":" ")+o.name+" at "+niceTime(to)+".");
    }

function leadsFor(where){
  const v = String((S.leads||{})[where==="town"?"town":"home"]||"").split(/[,;\s]+/).map(Number).filter(x=>Number.isFinite(x)&&x>=0&&x<=600);
  return v.length ? [...new Set(v)].sort((a,b)=>b-a) : [0];
}

function buildReminders(n){
  const groups = new Map(), now = new Date();
  for(let i=0;i<n;i++){
    const d = addDays(now,i);
    for(const it of itemsFor(d).timed){
      if(it.skip) continue;
      const [h,m] = it.time.split(":").map(Number);
      for(const lead of leadsFor(it.where)){
        const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m - lead);
        const k = ymd(at)+"T"+pad(at.getHours())+":"+pad(at.getMinutes());
        const g = groups.get(k+"|"+lead) || {at:k, lead, time:it.time, items:[]};
        g.items.push(it); groups.set(k+"|"+lead, g);
      }
    }
  }
  const out = [];
  for(const [key,g] of groups){
    const when = g.lead ? "In "+g.lead+" min ("+niceTime(g.time)+")" : niceTime(g.time);
    const title = when+": "+g.items.map(x=>x.title).join(", ");
    const body = g.items.map(x=> x.list ? x.list.join("\n") : (x.kind==="supp"? [x.title,x.detail].filter(Boolean).join(": ") : x.detail)).filter(Boolean).join("\n");
    out.push({key, at:g.at, title, body});
  }
  return out.sort((a,b)=>a.at.localeCompare(b.at));
}



const missable = it=> (it.kind==="supp" || it.kind==="routine") && it.time && it.routineId!=="bm";
function withFood(s){ return /meal|food/i.test(s.how||""); }
const abs = (dayStr, m)=> parseYmd(dayStr).getTime()/60000 + m;
function whenText(day, time){
  const t = ymd(new Date()), tm = ymd(addDays(new Date(),1));
  return niceTime(time)+" "+(day===t?"today":day===tm?"tomorrow":DAYS_LONG[parseYmd(day).getDay()]);
}
function planMiss(it, srcDay, now){
  const M = S.miss, today = ymd(now), nowM = now.getHours()*60+now.getMinutes();
  const later = where=> Math.ceil((nowM + Math.max(...leadsFor(where)) + 5)/5)*5;
  const cut = t=> mins(parseTime(t)||"23:59");
  if(it.moved) return {why:"This was already a catch-up, so it isn't moved again."};
  if(it.kind==="supp"){
    const s = S.supplements.find(x=>x.id===it.suppId); if(!s) return {why:"Not on your list any more."};
    const gap = Number(S.rules.spacingMin)||120, food = withFood(s);
    const DT = dayTimes(now), meals = ["breakfast","lunch","dinner"].map(k=>parseTime(DT[k])).filter(Boolean).map(mins).sort((a,b)=>a-b);
    const clash = (day,m)=> itemsFor(parseYmd(day)).timed.find(o=>o.kind==="supp" && o.suppId!==s.id && (o.binder!==!!s.binder) && Math.abs(mins(o.time)-m)<gap);
    let day = today, m = null;
    for(let tries=0; tries<12 && m===null; tries++){
      const from = day===today ? (food? nowM : later(it.where)) : 0;
      if(food){ m = meals.find(x=>x>=from) ?? null; }
      else { m = Math.max(from, meals[0]||480); if(m>cut(M.suppCutoff)) m = null; }
      while(m!==null){
        const c = clash(day,m); if(!c) break;
        const next = food ? meals.find(x=>x>m) : mins(c.time)+gap;
        m = (next===undefined || (!food && next>cut(M.suppCutoff))) ? null : Math.ceil(next/5)*5;
      }
      if(m===null){ day = ymd(addDays(parseYmd(day),1)); }
    }
    if(m===null) return {why:"No safe time in the next few days."};
    const at = abs(day,m);
    for(let k=0;k<3;k++){ const dd = addDays(parseYmd(today),k);
      if(!s.active || !dueOn(s,dd)) continue;
      for(const t of parseTimes(s.times)){ const x = abs(ymd(dd),mins(t));
        if(x>abs(srcDay,mins(it.time)) && Math.abs(x-at) < (Number(M.skipWithin)||0)) return {why:"Your next regular dose is "+whenText(ymd(dd),t)+", so skip this one."}; } }
    return {day, time:fromMins(m), why: food ? "Next meal" + (day===today?"":" (none left today)") : "Keeps "+Math.round(gap/6)/10+" h from "+(s.binder?"your other supplements":"psyllium")};
  }
  const r = (S.routine||[]).find(x=>x.id===it.routineId); if(!r) return {why:"Not on your list any more."};
  const town = (r.where||"home")==="town", cutoff = cut(town? M.townCutoff : M.homeCutoff);
  const daily = !r.alt && !(r.days&&r.days.length);
  if(srcDay===today && later(it.where)<=cutoff) return {day:today, time:fromMins(later(it.where)), why:"Later today"};
  if(daily) return {why: srcDay===today ? "Too late today. It's back on your list tomorrow." : "It's back on your list today."};
  const start = srcDay===today ? 1 : 0;
  for(let k=start;k<15;k++){
    const d = addDays(parseYmd(today),k), dn = DAYS_LONG[d.getDay()];
    if(k===0 && nowM>=cutoff) continue;
    if(dueOn(r,d)) return {why:"Your next regular one is "+(k===1?"tomorrow":k===0?"today":dn)+", so skip this one."};
    if(town){
      const others = (S.routine||[]).filter(o=>o.id!==r.id && o.active && o.where==="town");
      if(!others.length) return {day:ymd(d), time:it.time, why:"Next day (no other town days set)"};
      if(others.some(o=>dueOn(o,d))) return {day:ymd(d), time:it.time, why:"Your next town day"};
      continue;
    }
    if(dueOn(r,addDays(d,1))) return {why:"Your next regular one is "+DAYS_LONG[addDays(d,1).getDay()]+", and you want a day between."};
    return {day:ymd(d), time:it.time, why:"Next free day"};
  }
  return {why:"No free day found."};
}
function markMissed(it, srcDay, auto){
  const lg = dayLog(srcDay); lg.missed = lg.missed||{};
  if((lg.missed[it.id] && !lg.missed[it.id].undone) || lg.done[it.id]) return false;
  const p = planMiss(it, srcDay, new Date());
  const rec = {auto:!!auto, why:p.why};
  if(p.day){
    const id = "mv:"+srcDay+":"+it.id;
    S.moved = (S.moved||[]).filter(m=>m.id!==id);
    S.moved.push({id, day:p.day, time:p.time, kind:it.kind, title:"Catch-up: "+it.title, detail:it.detail, where:it.where||"home",
      suppId:it.suppId, routineId:it.routineId, binder:it.binder, from:srcDay+" "+it.time});
    rec.to = id; rec.day = p.day; rec.time = p.time;
  }
  const n = {id:"n"+Date.now()+Math.random().toString(36).slice(2,6), about:it.title.replace(/^Catch-up: /,""), feel:"", date:srcDay, time:it.time,
    text:"Missed"+(auto?" (not ticked off)":"")+". "+(p.day? "Moved to "+whenText(p.day,p.time)+". "+p.why+"." : p.why), missed:true};
  (S.notes=S.notes||[]).push(n); rec.note = n.id;
  lg.missed[it.id] = rec;
  return true;
}
function undoMissed(srcDay, itemId){
  const lg = dayLog(srcDay), rec = (lg.missed||{})[itemId]; if(!rec) return;
  if(rec.to) S.moved = (S.moved||[]).filter(m=>m.id!==rec.to);
  if(rec.note) S.notes = (S.notes||[]).filter(n=>n.id!==rec.note);
  lg.missed[itemId] = {undone:true}; 
}

function sweepMissed(){
  const now = new Date(), after = Number(S.miss.after)||30; let changed = false;
  if(!S.missFrom){ S.missFrom = ymd(now); changed = true; }
  for(let k=2;k>=0;k--){
    const d = addDays(now,-k), key = ymd(d);
    if(key < (S.missFrom||key)) continue;
    for(const it of itemsFor(d).timed){
      if(!missable(it) || it.skip) continue;
      const due = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ...it.time.split(":").map(Number));
      if(now - due < after*60000) continue;
      const lg = S.log[key]; if(lg && (lg.done[it.id] || (lg.missed||{})[it.id])) continue;
      if(!(lg && (lg.missed||{})[it.id]) && markMissed(it, key, true)) changed = true;
    }
  }
  return changed;
}

    item:{label:x.label||x.word, pat:HH.wordsPat(String(x.word).replace(/\|/g,",")), level:x.level}, on:true});

async function saveFile(name, text, type){
  if(!SERVER && location.protocol!=="file:" && window.claude && window.claude.use){
    const dl = await window.claude.use("downloads").catch(()=>null);
    if(dl){ try{ await dl.save({filename:name, data:text}); toast("Saved "+name); }catch(e){ if(e && e.code!=="declined") toast("Couldn't save the file here"); } return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

async function combineFrom(b){
  if(!b || !b.state || typeof b.state!=="object") { toast("That isn't an all systems you backup"); return; }
  const o = merge(b.state); let days = 0, items = 0;
  for(const [k,ol] of Object.entries(o.log||{})){
    const sl = S.log[k];
    if(!sl){ S.log[k] = ol; days++; continue; }
    sl.done = Object.assign({}, ol.done||{}, sl.done||{});
    if((Number(ol.oz)||0) > (Number(sl.oz)||0)){ sl.oz = ol.oz; sl.sips = ol.sips||[]; }
    if(ol.feel) sl.feel = Object.assign({}, ol.feel, sl.feel||{});
    if(ol.missed) sl.missed = Object.assign({}, ol.missed, sl.missed||{});
    if(ol.cooked && !sl.cooked) sl.cooked = ol.cooked;
    days++;
  }
  for(const f of ["notes","doctor","labs","visits","moved","supplements","routine"]){
    const have = new Set((S[f]||[]).map(x=>x.id));
    for(const x of (o[f]||[])) if(x && x.id && !have.has(x.id)){ (S[f]=S[f]||[]).push(x); items++; }
  }
  for(const [k,v] of Object.entries(o.dayOver||{})) if(!(S.dayOver||{})[k]) (S.dayOver=S.dayOver||{})[k] = v;
  save();
  const pv = b.kv && b.kv["pantryplanner.v1"];
  if(pv){ try{ const a = JSON.parse(pv), cur = JSON.parse(localStorage.getItem("pantryplanner.v1")||"null");
    let out = a;
    if(cur){ out = Object.assign({}, cur); out.pantry = Object.assign({}, a.pantry||{}, cur.pantry||{}); out.got = Object.assign({}, a.got||{}, cur.got||{});
      const ids = new Set((cur.custom||[]).map(x=>x.id)); out.custom = [...(cur.custom||[]), ...(a.custom||[]).filter(x=>!ids.has(x.id))]; }
    const v = JSON.stringify(out); localStorage.setItem("pantryplanner.v1", v);
    if(SERVER) await fetch("/api/kv/pantryplanner.v1",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:v})});
  }catch(_){} }
  toast(`Combined: ${days} day${days===1?"":"s"} and ${items} note${items===1?"":"s"}, questions or items added`); TAB="today"; render();
}

function nudgeList(){
  const N = S.nudge||{}, today = parseYmd(ymd(new Date()));
  if(N.on===false) return [];
  const used = Object.keys(S.log).filter(k=>Object.keys((S.log[k]||{}).done||{}).length || (S.log[k]||{}).oz).sort();
  if(!used.length) return [];
  const first = parseYmd(used[0]), out = [];
  const lastDone = (kind,id)=>{ const re = new RegExp("(^|:)"+kind+":"+id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(:|$)");
    let best = null; for(const [k,lg] of Object.entries(S.log)) if(Object.keys(lg.done||{}).some(x=>re.test(x)) && (!best||k>best)) best = k; return best; };
  const check = (x, kind, what)=>{
    if(!x.active) return;
    const n = x.nudgeDays==null ? Number(N.days)||7 : Number(x.nudgeDays); if(!n) return;
    const key = kind+":"+x.id; if((N.snooze||{})[key] && N.snooze[key] > ymd(today)) return;
    const ld = lastDone(kind, x.id), from = ld ? parseYmd(ld) : first;
    const gap = Math.round((today - from)/86400000); if(gap < n) return;
    let due = 0; for(let i=1;i<=gap;i++) if(dueOn(x, addDays(from,i))) due++;
    if(due < 2) return;
    out.push({key, x, kind, what, gap, never:!ld});
  };
  for(const r of S.routine||[]) check(r, "rt", "routine");
  for(const s of S.supplements||[]) check(s, "supp", "supplement");
  return out.sort((a,b)=>b.gap-a.gap);
}

let PH = null;
function loadQr(){
  return new Promise(res=>{ if(window.qrcode) return res(); const sc=document.createElement("script"); sc.src="/qr.js"; sc.onload=()=>res(); sc.onerror=()=>res(); document.head.appendChild(sc); });
}
function qrSvg(url){
  if(!window.qrcode) return "";
  const q = qrcode(0,"M"); q.addData(url); q.make();
  return q.createSvgTag({cellSize:5, margin:3, scalable:true});
}
async function loadPhones(){
  const box = document.getElementById("phonesBody"); if(!box) return;
  try{ PH = await (await fetch("/api/phones",{cache:"no-store"})).json(); }catch(e){ box.innerHTML = `<p style="margin:0">Couldn't check phone access. Close and reopen all systems you.</p>`; return; }
  await loadQr();
  const iphoneUrl = `http://${PH.local}:${PH.port}/?k=${encodeURIComponent(PH.key)}`;
  const ip = PH.ips[0];
  const androidUrl = ip ? `http://${ip}:${PH.port}/?k=${encodeURIComponent(PH.key)}` : null;
  const card = (who, url, steps)=>`<div class="qrcard"><h3>${who}</h3><div class="qr">${qrSvg(url)}</div><code>${esc(url)}</code><ol>${steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
  box.innerHTML = `<p style="margin:0">Your phones can open this app while they're on the same Wi-Fi as the laptop. Everything stays on the laptop, so both phones always see the same week, pantry and shopping list.</p>
    <label class="inline" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="phonesToggle" ${PH.enabled?"checked":""}> Let our phones in</label>
    ${PH.enabled?`<div class="qrgrid">
      ${card("iPhone", iphoneUrl, ["Open the Camera and point it at this code. Tap the yellow link.","In Safari, tap the Share button (square with an arrow), then <b>Add to Home Screen</b>, then <b>Add</b>.","Open all systems you from the new icon from now on.","If the link won't open, scan the Android code instead. It works on iPhone too."])}
      ${androidUrl?card("Android", androidUrl, ["Open the Camera (or Google Lens) and point it at this code. Tap the link.","In Chrome, tap the three dots, then <b>Add to Home screen</b>.","If it stops opening someday, scan this code again. The Wi-Fi can give the laptop a new address."]):`<p class="warnbox">The laptop isn't on a Wi-Fi network right now, so there's no Android code. Connect to Wi-Fi and reopen this tab.</p>`}
    </div>
    <small class="muted">The code has a private key in it, so only phones that scan it can get in. A neighbor on a campground Wi-Fi can't. If a phone is lost, press the button below. The old code stops working, and you scan the new one on the phones you keep.</small>
    <div><button class="btn ghost" id="phonesNewKey">Make a new code</button></div>`:""}`;
}


const DOC_STATUS = {ask:"To ask", sent:"Sent, waiting", answered:"Answered"};
let NOTE_ABOUT = "";
function noteSubjects(){
  const out = [];
  for(const x of S.supplements) out.push(x.name);
  for(const x of (S.routine||[])) out.push(x.name);
  const seen = new Set();
  for(const dow of [0,1,2,3,4,5,6]) for(const k of ["b","l","s","d","e"]){ const r = recipe(((S.week[dow]||{}).ids||{})[k]); if(r && !seen.has(r.n)){ seen.add(r.n); out.push(r.n); } }
  return out;
}

function labFlag(x){
  if(x.value==null || x.value==="") return "";
  if(x.high!=null && x.high!=="" && +x.value>+x.high) return x.low==null||x.low===""? "Present" : "High";
  if(x.low!=null && x.low!=="" && +x.value<+x.low) return "Low";
  return "In range";
}

  let h = `<div class="stack">

function icsText(){
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//all systems you//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:all systems you"];
  const today = new Date(), stamp = ymd(today).replace(/-/g,"")+"T000000Z";
  const escI = s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m);
  const ev = (uid, date, time, title, body, rrule, where)=>{
    lines.push("BEGIN:VEVENT","UID:"+uid+"@daily-helper","DTSTAMP:"+stamp,
      "DTSTART:"+ymd(date).replace(/-/g,"")+"T"+time.replace(":","")+"00","DURATION:PT10M",
      "SUMMARY:"+escI(title), "DESCRIPTION:"+escI(body||""), "RRULE:"+rrule);
    for(const lead of leadsFor(where)) lines.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(title),"TRIGGER:-PT"+lead+"M","END:VALARM");
    lines.push("END:VEVENT");
  };
  const perDay = i=>i.kind==="meal"||i.id==="snack"||i.id==="treat"||i.weekly;
  const daily = itemsFor(today,true).timed.filter(i=>i.kind!=="freezer" && i.kind!=="cook" && !perDay(i));
  daily.forEach(i=>ev(i.id.replace(/[^a-z0-9]/gi,"-"), today, i.time, i.title, i.detail, "FREQ=DAILY", i.where));
  for(let k=0;k<7;k++){
    const d = addDays(today,k), byday = ["SU","MO","TU","WE","TH","FR","SA"][d.getDay()];
    const its = itemsFor(d,true).timed;
    its.filter(perDay).forEach(i=>ev(i.id.replace(/[^a-z0-9]/gi,"-")+"-"+byday, d, i.time, i.title, i.detail, "FREQ=WEEKLY;BYDAY="+byday, i.where));
    const alt = !!cookSession(addDays(d,1));
    for(const wk of (alt?[0,7]:[0])){
      const dd = addDays(d,wk), p = itemsFor(dd,true).timed.find(i=>i.kind==="freezer");
      if(p) ev("pull-"+byday+(alt?"-"+ymd(dd):""), dd, p.time, p.title, p.list.join("\n"), alt?"FREQ=WEEKLY;INTERVAL=2":"FREQ=WEEKLY;BYDAY="+byday);
    }
    for(const wk of [0,7]){
      const dd = addDays(d,wk), c = itemsFor(dd,true).timed.find(i=>i.kind==="cook");
      if(c) ev("cook-"+ymd(dd), dd, c.time, c.title, c.detail, "FREQ=WEEKLY;INTERVAL=2");
    }
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function runAction(p){
  const act = p.get("do"); if(!act) return "";
  const key = ymd(new Date()), lg = dayLog(key), {meals, supps} = quickItems(new Date());
  if(act==="water"){
    const n = Number(p.get("oz")) || PHX.firstSize();
    PHX.addWater(lg, n);
    return "Added "+n+" oz. "+PHX.waterText(lg)+".";
  }
  if(act==="supps"){
    const due = supps.filter(i=>i.time && !lg.done[i.id] && mins(i.time) <= minutesNow()+60);
    due.forEach(i=>markDone(key, i.id));
    return due.length ? "Checked off "+due.map(i=>i.title).join(", ")+"." : "Nothing due right now. Tick the ones you took below.";
  }
  if(act==="meal"){
    const m = p.get("m")||"next";
    let it = m==="next" ? meals.filter(i=>!lg.done[i.id] && i.time && mins(i.time) <= minutesNow()+90).pop() || meals.find(i=>!lg.done[i.id]) : meals.find(i=>i.id===MEAL_IDS[m]);
    if(!it) return m==="next" ? "All of today's meals are already ticked." : "That meal isn't on today's list.";
    markDone(key, it.id); return "Done: "+it.title+".";
  }
  if(act==="feel"){

    lg.feel = Object.assign({}, lg.feel, {overall:v}); lg.done[PHX.feelId] = true;

  if(act==="done" && p.get("id")){ markDone(key, p.get("id")); return "Checked off."; }
  return "";
}

function phoneSave(download){
  return async function(name, text, type){
    if(/\.json$/.test(name)) pSet("dh.lastBackup", ymd(new Date()));
    if(TOUCH && navigator.canShare){
      const f = new File([text], name, {type:type||"text/plain"});
      if(navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f], title:name}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
    }
    return download(name, text, type);
  };
}
